function getWords(text) { return Array.from(text.matchAll(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*(?:\/[\p{L}\p{N}]+)*/gu),m=>({word:m[0],start:m.index,end:m.index+m[0].length})); }

const banned=new Set('a an and are as at be been being but by can could did do does for from had has have he her his i in into is it its may might must not of on or our out she should so such than that the their them there these they this those to was were which who will with would you your'.split(' '));
function fullCue(s){let ws=getWords(s).map(x=>x.word);return ws.filter((w,i)=>i%4!==2).slice(0,45).join(' / ');}

function autoPhrases(essay,sentences){

  const used=new Set(),out=[];
  for(const match of essay.matchAll(re)){
    let ans=match[0].trim().replace(/[,;:.]+$/,'');
    let ws=getWords(ans).map(w=>w.word);
    if(ws.length<4||ws.length>9||ans.length>73||ws.some(x=>/^(is|are|was|were|has|have|had|will|must|should|could|might|may|can|would|does|did)$/i.test(x)))continue;

    let source=sentences.find(s=>s.text.includes(ans))?.text||essay.slice(Math.max(0,match.index-40),match.index+ans.length+50);
    out.push({kind:'exact',prompt:'Restore the missing noun phrase from the author’s sentence:',context:source.replace(ans,'[noun phrase]'),expected:ans,hint:ws.slice(0,2).join(' ')+'…',label:'Noun phrase',wordCount:ws.length});

function exactTask(prompt,expected,options={}){return {kind:'exact',prompt,expected,...options};}
function buildExerciseBundle(essay,question='',plan=null) {
  essay=essay.replace(/\r/g,'').trim();const {paragraphs,sentences}=splitEssay(essay);const pool=sample(sentences,8);const more=sample(sentences,12);
  const stages={};
  const analysis=Array.isArray(plan?.analysis)&&plan.analysis.length?plan.analysis.map(x=>({kind:'reasoning',prompt:x.question,expected:x.model_answer,evidence:x.evidence,hint:'Quote the exact evidence and explain how the argument works.'})):

        context:`${previous} → [YOUR ANSWER]${next?' → '+next:''}\n\nSource evidence: ${chain.evidence}`,
        hint:`Starts with “${lead}…” · ${wordCount(missing)} words. Do not add unstated intermediate steps.`,

}

const SAMPLE_TITLE='Sharing Household Tasks Equally';
const SAMPLE_QUESTION='Nowadays, women as well as men work full-time. Therefore, women and men should share household tasks equally. To what extent do you agree or disagree?';
const SAMPLE_ESSAY=`It is widely recognized that the paradigm of work has shifted, with both women and men engaging in full-time employment. This has sparked a debate on whether household chores should be equally divided between partners. I agree with the idea of sharing domestic responsibilities but believe the application of 'equality' in this context should be nuanced rather than rigid.

On the surface, the argument for an equal division of household chores appears straightforward and justified. When both partners work full-time, it seems logical to assume that neither has more time than the other to dedicate to domestic responsibilities. Sharing tasks such as cooking, cleaning, and managing bills would, in theory, prevent one partner from bearing a disproportionate burden, fostering a sense of fairness and mutual respect within the relationship. This arrangement could contribute to a more balanced partnership, where both individuals feel supported both in their careers and at home.

However, the concept of dividing tasks 'equally' is not as straightforward as it seems. Equality does not necessarily mean splitting every task down the middle. Each relationship is unique, and what constitutes a fair share of work can vary significantly between couples. For some, an equal division might mean one person does more cooking while the other takes on more cleaning, depending on each person's skills and preferences. The key is not a rigid 50/50 split but a flexible arrangement that feels equitable to both partners.

Moreover, considering that full-time jobs differ vastly in terms of hours, stress levels, and mental exhaustion, the expectation for an exact split of household duties may not always be practical or fair. A partner working 60-hour weeks in a high-stress job may not have the same energy or availability for household tasks as one with a standard 40-hour job. Thus, insisting on an equal division without considering these factors could lead to unfair pressure and dissatisfaction, undermining the very goal of sharing tasks to achieve balance and harmony.

In conclusion, while the principle of sharing household tasks between working partners is grounded in fairness, the application of this principle must be nuanced and adaptable to each couple's unique circumstances. Equality should be measured not by an exact division of tasks but by the effort and intention to support one another, taking into account the varying demands of each partner's job.`;

function markDifferences(original,student){
  const a=String(original).split(/(\s+)/),b=String(student).trim().split(/\s+/).filter(Boolean);
  const w=a.filter(t=>t.trim());if(w.length>550)return esc(original);
  const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\u2018\u2019\u02bc\u201b\uFF07]/g,"'").replace(/[\u2010-\u2015\u2212]/g,'-').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'');
  const p=w.map(norm),q=b.map(norm),m=p.length,n=q.length;
  if(m*n>400000)return esc(original);
  const dp=Array.from({length:m+1},()=>new Uint16Array(n+1));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=p[i]===q[j]&&p[i]!==''?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);

 document.addEventListener('keydown',ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'&&mode==='stage'){ev.preventDefault();if(D('answerArea'))checkTask();else if(D('mainContent')?.querySelector('.cloze-passage .cloze-inline-input'))checkCloze();}if(ev.key==='Escape'){closeModal('essayModal');closeModal('settingsModal');D('sidebar').classList.remove('open');}});
 document.addEventListener('click',async ev=>{const close=ev.target.closest('[data-close]');if(close){closeModal(close.dataset.close);return;}const btn=ev.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action,id=btn.dataset.id;
 switch(act){case'renameEssay':showRenameEssay(id);break;case'argumentScrollTo':{
  const target=id==='overview'?D('argumentOverviewCard'):D('argumentCard-'+id);
  const scroll=D('argumentWorkbookBody');
  if(target&&scroll){
   scroll.scrollTo({top:target.offsetTop-scroll.offsetTop+scroll.scrollTop-46,behavior:'smooth'});
   const i=Number(id);
   if(Number.isInteger(i)&&id!=='overview'){
    const src=D('readingSourceScroll'),para=D('sourceParagraph-'+(i+1));
    if(src&&para){src.scrollTo({top:para.offsetTop-src.offsetTop+src.scrollTop-12,behavior:'smooth'});}
   }
  }
 }break;case'argumentJumpSource':{
  const scroll=D('readingSourceScroll'),target=D('sourceParagraph-'+(Number(id)+1));
  if(scroll&&target)scroll.scrollTo({top:target.offsetTop-scroll.offsetTop+scroll.scrollTop-12,behavior:'smooth'});
 }break;case'reader':if(selected())setMode('reader');break;case'backFromReader':setMode(readerReturn==='stage'?'stage':'overview');break;case'readingMobileView':readingMobileView=id==='essay'?'essay':'question';{const root=D('mainContent').querySelector('.reading-workspace');if(root){root.dataset.mobileView=readingMobileView;D('mainContent').querySelectorAll('.reading-mobile-tabs button').forEach(b=>{const active=b.dataset.id===readingMobileView;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});}}break;case'jumpSourceParagraph':{
  const scroll=D('readingSourceScroll'),target=D('sourceParagraph-'+id);
  if(scroll&&target)scroll.scrollTo({top:target.offsetTop-scroll.offsetTop+scroll.scrollTop-12,behavior:'smooth'});
  if(mode==='stage'&&stageId==='1'){
   const notebook=D('argumentWorkbookBody'),card=D('argumentCard-'+(Number(id)-1));
   if(notebook&&card)notebook.scrollTo({top:card.offsetTop-notebook.offsetTop+notebook.scrollTop-46,behavior:'smooth'});
  }
 }break;case'home':setMode('dashboard');break;case'addEssay':showCreate();break;case'selectEssay':db.selectedId=id;argumentView='whole';argumentParagraphIndex=0;stageSourceTop=0;readerSourceTop=0;save();setMode('overview');break;case'overview':setMode('overview');break;case'stage':setMode('stage',id);break;case'prevTask':taskNav(progress(selected(),stageId).session.current-1);break;case'nextTask':taskNav(progress(selected(),stageId).session.current+1);break;case'task':mode='stage';taskNav(Number(id));break;case'checkTask':await checkTask();break;case'checkCloze':checkCloze();break;case'redo':redo();break;case'retryTask':retryTask();break;case'resultsSummary':summaryView();break;case'scrollGap':{const gap=D('gap-'+id);gap?.scrollIntoView({behavior:'smooth',block:'center'});gap?.querySelector('input')?.focus();break;}case'toggleSource':showSource=!showSource;render();break;case'export':exportProgress();break;case'import':D('importFile').click();break;case'enhanceAI':await enhance();break;case'explainAI':await explainAI(Number(id));break;case'deleteEssay':{const e=selected();if(!confirm(`Permanently delete "${e.title}" and all its attempts from this browser? Export a backup first if you need it.`))return;db.deletedIds ||= [];if(!db.deletedIds.includes(e.id))db.deletedIds.push(e.id);db.essays=db.essays.filter(x=>x.id!==e.id);db.selectedId=db.essays[0]?.id||null;save();setMode('dashboard');toast('Essay deleted.');break;}case'saveSettings':{const inp=D('accessInput');if(inp)db.accessCode=inp.value;save();closeModal('settingsModal');toast('Settings saved.');break;}}
 });
}
async function initialize(){db=load();if(!db.selectedId)db.selectedId=db.essays[0]?.id;eventBindings();render();try{const r=await fetch('/api/health');if(r.ok){const d=await r.json();ai.enabled=!!d.ai;ai.model=d.model;ai.accessCodeRequired=!!d.accessCodeRequired;render();}}catch{ /* Standalone HTML continues in offline mode. */ }
 if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.getRegistrations().then(regs=>regs.filter(r=>{try{return new URL(r.active?.scriptURL||r.waiting?.scriptURL||r.installing?.scriptURL||'',location.href).pathname==='/sw.js';}catch{return false;}}).forEach(r=>r.unregister())).catch(()=>{});
}
initialize();
