const SAMPLE_TITLE='Sharing Household Tasks Equally';
const SAMPLE_QUESTION='Nowadays, women as well as men work full-time. Therefore, women and men should share household tasks equally. To what extent do you agree or disagree?';
const SAMPLE_ESSAY=`It is widely recognized that the paradigm of work has shifted, with both women and men engaging in full-time employment. This has sparked a debate on whether household chores should be equally divided between partners. I agree with the idea of sharing domestic responsibilities but believe the application of 'equality' in this context should be nuanced rather than rigid.

On the surface, the argument for an equal division of household chores appears straightforward and justified. When both partners work full-time, it seems logical to assume that neither has more time than the other to dedicate to domestic responsibilities. Sharing tasks such as cooking, cleaning, and managing bills would, in theory, prevent one partner from bearing a disproportionate burden, fostering a sense of fairness and mutual respect within the relationship. This arrangement could contribute to a more balanced partnership, where both individuals feel supported both in their careers and at home.

However, the concept of dividing tasks 'equally' is not as straightforward as it seems. Equality does not necessarily mean splitting every task down the middle. Each relationship is unique, and what constitutes a fair share of work can vary significantly between couples. For some, an equal division might mean one person does more cooking while the other takes on more cleaning, depending on each person's skills and preferences. The key is not a rigid 50/50 split but a flexible arrangement that feels equitable to both partners.

Moreover, considering that full-time jobs differ vastly in terms of hours, stress levels, and mental exhaustion, the expectation for an exact split of household duties may not always be practical or fair. A partner working 60-hour weeks in a high-stress job may not have the same energy or availability for household tasks as one with a standard 40-hour job. Thus, insisting on an equal division without considering these factors could lead to unfair pressure and dissatisfaction, undermining the very goal of sharing tasks to achieve balance and harmony.

In conclusion, while the principle of sharing household tasks between working partners is grounded in fairness, the application of this principle must be nuanced and adaptable to each couple's unique circumstances. Equality should be measured not by an exact division of tasks but by the effort and intention to support one another, taking into account the varying demands of each partner's job.`;

 return `<div class="section-heading"><h2>Practice questions</h2><span>${Object.keys(ses.results).length} of ${data.tasks.length} checked</span></div>${dots}<section class="study-block"><div class="task-topline"><div class="task-meta">${icon(task.kind==='reasoning'?'lightbulb':'edit')} ${task.kind==='reasoning'?'CRITICAL REASONING':task.kind==='essay'?'FULL ESSAY RECALL':'EXACT-WORD RECONSTRUCTION'}</div><span class="task-counter">${i+1} / ${data.tasks.length}</span></div><p class="task-question">${esc(q)}</p>${context?`<div class="task-context">${esc(context)}</div>`:''}${task.hint?`<div class="hint-box">${icon('lightbulb')}<span>${esc(task.hint)}</span></div>`:''}<div class="answer-label">YOUR ANSWER</div><textarea class="answer-box ${task.kind==='essay'?'big':''}" id="answerArea" data-task="${i}" ${result?'':''} spellcheck="true" placeholder="Write your answer here. Your work is saved as you type...">${esc(answer)}</textarea><div class="task-footer"><div class="footer-hint">⌘ / Ctrl + Enter to check</div><div class="btn-group"><button class="btn btn-ghost" data-action="prevTask" ${i===0?'disabled':''}>${icon('chevronLeft')} Previous</button><button class="btn btn-blue" data-action="checkTask" ${!answer.trim()?'disabled':''} id="checkTaskButton">${icon('check')} ${result?'Check again':'Check answer'}</button></div></div>${result?renderFeedback(result,task,st,i,data.tasks.length,done):''}</section>`;
}
function markDifferences(original,student){
  const a=String(original).split(/(\s+)/),b=String(student).trim().split(/\s+/).filter(Boolean);
  const w=a.filter(t=>t.trim());if(w.length>550)return esc(original);
  const norm=s=>s.toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'');
  const p=w.map(norm),q=b.map(norm),m=p.length,n=q.length;
  if(m*n>400000)return esc(original);
  const dp=Array.from({length:m+1},()=>new Uint16Array(n+1));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=p[i]===q[j]&&p[i]!==''?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const matched=new Set();let i=0,j=0;
  while(i<m&&j<n){if(p[i]===q[j]&&p[i]!==''){matched.add(i);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  let pos=0;return a.map(t=>t.trim()?matched.has(pos++)?esc(t):`<strong class="highlight-error">${esc(t)}</strong>`:esc(t)).join('');
}
function pTemp(task,i){return progress(selected(),stageId).session.drafts[i]||'';}
function renderFeedback(r,task,st,i,n,done){const exact=r.exact;const type=r.pending?'pending':exact?'correct':'incorrect';const style=r.score===null?'REFERENCE':exact?'EXACT MATCH':r.severity==='minor'?'MINOR DIFFERENCE':'NEEDS REVISION';let aiNotes=r.aiGrade;
 return `<div class="feedback ${type}" id="feedbackPanel"><div class="feedback-head"><div class="feedback-label">${icon(r.pending?'info':exact?'checkCircle':'xCircle')} ${r.pending?'Reference shown':style}</div><div class="feedback-score">${r.score===null?'—':r.score+'%'}</div></div><div class="feedback-body"><p>${esc(r.feedback||'')}</p>${r.score!==null&&!exact?`<span class="tag ${r.severity==='minor'?'warning':''}">${r.severity==='minor'?'Not a serious meaning change':'Meaning impact requires review'}</span>`:''}<div class="correction-label">${task.kind==='reasoning'?'EVIDENCE / REFERENCE':'ORIGINAL AUTHOR WORDING'}</div><div class="corrected">${!r.exact&&task.kind!=='reasoning'?markDifferences(r.corrected_answer||task.expected, pTemp(task,i)):esc(r.corrected_answer||task.expected)}</div>${task.evidence?`<div class="correction-label">SOURCE EVIDENCE</div><div class="corrected">${esc(task.evidence)}</div>`:''}${aiNotes?`<div class="correction-label">AI FEEDBACK · EXPLANATION</div><p>${esc(aiNotes.feedback)}</p>${(aiNotes.issues||[]).map(x=>`<div class="feedback-issue"><strong class="${x.severity==='minor'?'minor-label':'major-label'}">${x.severity==='minor'?'LESS SERIOUS':'SUBSTANTIVE'}: </strong>${esc(x.explanation)}</div>`).join('')}`:r.aiLoading?`<p>${'<span class="loading-spinner"></span>'} Analyzing the difference in meaning...</p>`:!exact&&ai.enabled&&task.kind==='exact'?`<button class="btn btn-outline" data-action="explainAI" data-id="${i}">${icon('sparkles')} Explain the difference with AI</button>`:''}<div class="feedback-actions"><button class="btn btn-outline" data-action="retryTask">${icon('refresh')} Try this question again</button>${i<n-1?`<button class="btn btn-dark" data-action="nextTask">Next question ${icon('arrow')}</button>`:`<button class="btn btn-dark" data-action="resultsSummary">${done?'See exercise results':'Review attempts'} ${icon('arrow')}</button>`}</div></div></div>`;
}
function renderCloze(data,p,st){const c=data.cloze,ses=p.session,results=ses.clozeResults,old=p.history;
 const passage=c.parts.map(x=>x.type==='text'?esc(x.text):`<button class="gap-pill ${results?(results[x.index-1]?.exact?'filled':'wrong'):''}" data-action="scrollGap" data-id="${x.index}">(${x.index}·${x.wordCount}) ________</button>`).join('');
 const fields=c.blanks.map(b=>{const r=results?.[b.index-1],v=ses.drafts[b.index-1]||'';return `<label class="cloze-field ${r?.exact?'is-correct':r?'is-wrong':''}" id="gap-${b.index}"><span class="cloze-field-head"><strong>(${b.index}·${b.wordCount})</strong><span>${b.wordCount} word${b.wordCount>1?'s':''} ${r?icon(r.exact?'checkCircle':'xCircle'):''}</span></span><input class="cloze-input" data-gap="${b.index-1}" ${results?'disabled title="Use Redo to start a new attempt"':''} placeholder="Type the exact missing phrase" value="${esc(v)}" autocomplete="off" spellcheck="false"/>${r?`<div class="cloze-field-result ${r.exact?'ok':''}">${r.exact?'✓ Exact match':`Original: ${esc(b.expected)}`}</div>`:''}</label>`;}).join('');
 let score=results?results.filter(r=>r.exact).length:0,percentage=results?Math.round(100*score/c.blanks.length):0;
 return `<div class="page-actions"><div class="btn-group"><span class="tag">${c.totalWords} words total</span><span class="tag blue">${c.masked} hidden (${Math.round(100*c.masked/c.totalWords)}%)</span></div><span class="tag">${results?'Checked':'Recall the exact phrasing'}</span></div><div class="eyebrow">COMPLETE THE PASSAGE</div><div class="cloze-passage">${passage}</div><div class="section-heading"><h2>Fill in the missing expressions</h2><span>Answers update automatically</span></div><div class="cloze-fields">${fields}</div><div class="page-actions" style="margin-top:22px"><div class="footer-hint">Every label shows blank number · exact number of missing words.</div><div class="btn-group"><button class="btn btn-blue" data-action="checkCloze" ${results?'disabled':''}>${icon('check')} ${results?'Attempt checked':'Check all blanks'}</button><button class="btn btn-outline" data-action="redo">${icon('refresh')} Redo</button></div></div>${results?`<div class="cloze-summary"><div class="big-grade">${score}/${c.blanks.length}</div><div><strong>${percentage}% exact</strong><p>${c.blanks.length-score} expressions to revisit.</p></div><div class="progress-track"><span style="width:${percentage}%"></span></div></div><p style="font-size:11px;color:#7e8a98;line-height:1.8">Wrong answers are shown directly beneath each field. Minor spelling, synonyms, and substantive changes all count as incorrect for exact reproduction; the original text is the answer key.</p>`:''}${renderHistory(p)}`;
}
function renderHistory(p){if(!p.history.length)return `<div class="attempt-panel"><h3>${icon('history')} Attempt history</h3><p style="font-size:11px;color:#8b95a0;margin:0">Complete an exercise to record your score. Redo it later to compare attempts.</p></div>`;
 return `<div class="attempt-panel"><h3>${icon('history')} Previous attempts</h3>${p.history.slice(-7).reverse().map((a,i)=>`<div class="attempt-row"><span>Attempt ${p.history.length-i} · ${formatTime(a.at)} ${a.legacy?'(earlier exercise set)':a.complete?'':'(partial)'}</span><strong>${a.score===null?'Reviewed':a.score+'%'}</strong></div>`).join('')}</div>`;}
function summaryView(){const e=selected(),p=progress(e,stageId),st=STAGES.find(s=>s.id===stageId),data=bundle().stages[stageId],ses=p.session;const keys=Object.keys(ses.results),len=data.tasks.length,complete=keys.length===len,scored=keys.map(k=>ses.results[k].score).filter(x=>typeof x==='number'),avg=scored.length?Math.round(scored.reduce((a,b)=>a+b,0)/scored.length):null,exact=keys.filter(k=>ses.results[k].exact).length;
 D('mainContent').innerHTML=`<div class="page-kicker">STAGE ${st.number} <span class="dot"></span> EXERCISE REVIEW</div><h1 class="page-title">Your attempt summary</h1><p class="page-subtitle">${esc(st.title)} · ${complete?'All tasks checked':'You have checked '+keys.length+' of '+len+' tasks'}</p><div class="metric-row"><div class="metric-box"><strong>${avg===null?'—':avg+'%'}</strong><small>AVG. WORD SCORE</small></div><div class="metric-box"><strong>${exact}/${len}</strong><small>EXACT RESPONSES</small></div><div class="metric-box"><strong>${p.history.length}</strong><small>ATTEMPTS SAVED</small></div></div><div class="study-block"><div class="section-heading" style="margin:0 0 13px"><h2>Question-by-question performance</h2></div>${data.tasks.map((t,i)=>{const r=ses.results[i];return `<button class="stage-tile" data-action="task" data-id="${i}" style="width:100%;margin:6px 0"><span class="stage-number">${i+1}</span><span class="stage-tile-info"><strong>${esc(t.prompt.slice(0,90))}</strong><small>${r?r.verdict||'Reviewed':'Not checked yet'}</small></span>${r?.exact?icon('checkCircle','done-icon'):`<span style="font-weight:750;font-size:11px;color:#a16659">${r?.score===null?'Review':r?.score===undefined?'—':r.score+'%'}</span>`}</button>`;}).join('')}<div class="page-actions"><button class="btn btn-outline" data-action="redo">${icon('refresh')} Redo this exercise</button><button class="btn btn-dark" data-action="stage" data-id="${STAGES[STAGES.findIndex(x=>x.id===stageId)+1]?.id||'1'}">${STAGES.at(-1).id===stageId?'Start over':'Next stage'} ${icon('arrow')}</button></div></div>${renderHistory(p)}`;
}
function recordIfDone(e,id,n){let p=progress(e,id),s=p.session;if(Object.keys(s.results).length!==n||s.saved)return;
 const results=Object.values(s.results),nums=results.map(x=>x.score).filter(x=>typeof x==='number');p.history.push({at:new Date().toISOString(),score:nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length):null,complete:true,correct:results.filter(x=>x.exact).length,total:n});s.saved=true;save();}
function redo(){const e=selected(),p=progress(e,stageId),ses=p.session;if((Object.keys(ses.results).length||ses.clozeResults)&&!ses.saved){
  const arr=ses.clozeResults||Object.values(ses.results),nums=arr.map(x=>x?.score).filter(x=>typeof x==='number');p.history.push({at:new Date().toISOString(),score:nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length):null,complete:false,correct:arr.filter(x=>x?.exact).length,total:arr.length});}
 p.session={drafts:{},results:{},current:0};save();render();toast('Fresh attempt started. Earlier attempts are still saved.');}
async function checkTask(){const e=selected(),data=bundle().stages[stageId],p=progress(e,stageId),i=p.session.current,task=data.tasks[i],answer=p.session.drafts[i]||'';if(!answer.trim())return toast('Write your answer first.');
 let g;
 if(task.kind==='reasoning')g={score:null,exact:false,semanticLabel:'Review',severity:'minor',verdict:'Reference review',feedback:ai.enabled?'Checking reasoning against evidence…':'AI assessment is unavailable. Compare your answer with the reference paragraph and source evidence; no correctness grade is claimed.',corrected_answer:task.expected,pending:!ai.enabled,aiLoading:ai.enabled};
 else g=gradeExact(answer,task.expected);
 p.session.results[i]=g;save();render();
 if(ai.enabled&&(task.kind==='reasoning'||task.kind==='essay'))await requestAIGrade(e,task,i,answer);
 else recordIfDone(e,stageId,data.tasks.length);
}
async function requestAIGrade(e,task,i,answer){let p=progress(e,stageId),originalEssayId=e.id,originalStageId=stageId;
 try{const out=await apiPost('/api/grade',{kind:task.kind,question:task.prompt,expected:task.expected,answer,essay:e.essay});
  // Do not write stale results into a newly started retry.
  const now=progress(e,originalStageId).session,record=now.results[i];if(!record||now.drafts[i]!==answer)return;
  const g=out.grade;record.aiGrade=g;record.aiLoading=false;if(task.kind==='reasoning'){record.score=g.score;record.feedback=g.feedback;record.verdict=g.verdict;record.pending=false;record.severity=(g.issues||[]).some(x=>x.severity==='substantive')?'substantive':'minor';record.corrected_answer=g.corrected_answer||task.expected;record.exact=g.score>=95;}
  save();recordIfDone(e,originalStageId,bundleFor(e).stages[originalStageId].tasks.length);
  if(selected()?.id===originalEssayId&&stageId===originalStageId&&mode==='stage')render();
 }catch(err){const now=progress(e,originalStageId).session,record=now.results[i];if(record&&now.drafts[i]===answer){record.aiLoading=false;record.pending=task.kind==='reasoning';record.feedback=`AI evaluation is unavailable: ${err.message}. Please compare against the reference; no automated analytic score is given.`;save();recordIfDone(e,originalStageId,bundleFor(e).stages[originalStageId].tasks.length);if(selected()?.id===originalEssayId&&stageId===originalStageId)render();}toast(err.message);}
}
function bundleFor(e){return buildExerciseBundle(e.essay,e.question,e.plan);}
function checkCloze(){const e=selected(),p=progress(e,stageId);if(p.session.saved)return toast('This attempt has been checked. Use Redo for a new attempt.');const data=bundle().stages[stageId],answers=data.cloze.blanks.map((b,i)=>gradeExact(p.session.drafts[i]||'',b.expected));p.session.clozeResults=answers;
 // Checking a cloze completes this attempt, even if unanswered blanks remain.
 const score=answers.filter(x=>x.exact).length,avg=Math.round(100*score/answers.length);
 p.history.push({at:new Date().toISOString(),score:avg,complete:true,correct:score,total:answers.length});p.session.saved=true;save();render();toast(`Checked: ${score} of ${answers.length} expressions match exactly.`);}
async function explainAI(i){const e=selected(),p=progress(e,stageId),task=bundle().stages[stageId].tasks[i],answer=p.session.drafts[i];if(!p.session.results[i]||!answer)return;const rec=p.session.results[i];rec.aiLoading=true;save();render();await requestAIGrade(e,task,i,answer);}
async function enhance(){const e=selected();if(!ai.enabled)return toast('AI is not configured on this server.');if(busy)return;busy=true;toast('Generating faithful, evidence-checked study questions...');const btns=document.querySelectorAll('[data-action="enhanceAI"]');btns.forEach(b=>b.disabled=true);
 try{const o=await apiPost('/api/generate',{essay:e.essay,question:e.question});e.plan=o.plan;for(const id of ['1','2','3','8','11']){if(e.progress?.[id]){for(const attempt of e.progress[id].history||[])attempt.legacy=true;e.progress[id].session={drafts:{},results:{},current:0};}}save();render();toast('AI-enhanced exercises are ready. Earlier attempts have been preserved as legacy history.');}catch(error){toast(error.message);btns.forEach(b=>b.disabled=false);}finally{busy=false;}}
function importProgress(text){let data;try{data=JSON.parse(text);}catch{throw new Error('This file is not valid JSON.');}if(data.version!==1||!Array.isArray(data.essays)||data.essays.some(e=>typeof e.title!=='string'||typeof e.essay!=='string'||typeof e.id!=='string'))throw new Error('This is not a compatible Style First backup.');
 if(!confirm('Import this backup and replace the data saved in this browser?'))return;
 db={version:1,essays:data.essays,selectedId:data.selectedId||data.essays[0]?.id,accessCode:db.accessCode};save();setMode('dashboard');toast('Backup imported successfully.');}
function exportProgress(){const safe={version:1,essays:db.essays,selectedId:db.selectedId,exportedAt:new Date().toISOString()};download('style-first-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(safe,null,2),'application/json');toast('Backup saved. Transfer this file to another device to import your progress.');}
function download(name,text,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function settings(){D('settingsContent').innerHTML=`<div class="settings-row"><h3>AI-generated training &amp; feedback</h3><p>Server status: <strong>${ai.enabled?'Connected — '+esc(ai.model||'AI model'):'Not configured — offline exercises available'}</strong>.</p><p>To create evidence-grounded analysis, precise nominalization tasks, Vietnamese sentence translations, and meaning-aware corrections, the hosting server needs an <code>OPENAI_API_KEY</code> environment variable. Never place the key in browser code.</p></div>${ai.accessCodeRequired?`<div class="settings-row"><h3>App access code</h3><p>Provided by whoever deployed this app. Stored locally only in your browser.</p><input type="password" id="accessInput" value="${esc(db.accessCode||'')}" placeholder="Enter access code" /></div>`:''}<div class="settings-row"><h3>Progress storage &amp; devices</h3><p>Essays, answers, and attempt histories are saved in this browser. To move them to another phone, tablet, or computer, export a JSON backup and import it there. Cloud synchronization is not included in this version.</p><div class="btn-group"><button class="btn btn-outline" data-action="export">${icon('download')} Export backup</button><button class="btn btn-outline" data-action="import">${icon('upload')} Import backup</button></div></div><div class="settings-box">${icon('shield')} Your essays are never sent to an AI service unless the server is configured and you explicitly generate exercises or request an AI grade. Creating exercises in offline mode stays local in your browser.</div><div class="page-actions" style="justify-content:flex-end"><button class="btn btn-dark" data-action="saveSettings">Save settings</button></div>`;}
async function createEssay(ev){ev.preventDefault();if(busy)return;const essay=D('essayInput').value.replace(/\r/g,'').trim(),question=D('essayQuestion').value.trim(),title=D('essayTitle').value.trim()||'Untitled model essay';const w=wordCount(essay);if(w<80){D('formMessage').textContent='Please paste at least 80 words of a complete model essay.';return;}if(essay.length>19000){D('formMessage').textContent='The essay is too long (max 19,000 characters).';return;}
 const obj={id:ID(),title,question,essay,plan:null,createdAt:new Date().toISOString(),progress:{}};db.essays.unshift(obj);db.selectedId=obj.id;save();closeModal('essayModal');D('essayForm').reset();setMode('overview');toast('Your essay is ready. 15 interactive exercises generated.');if(ai.enabled)enhance();}
function showCreate(){openModal('essayModal');D('essayTitle').focus();}
function taskNav(j){const e=selected(),p=progress(e,stageId),n=bundle().stages[stageId].tasks.length;p.session.current=Math.max(0,Math.min(n-1,j));save();render();const a=D('answerArea');if(a&&!p.session.results[p.session.current])a.focus();}
function retryTask(){const e=selected(),p=progress(e,stageId),i=p.session.current;delete p.session.results[i];p.session.saved=false; // A previously completed attempt remains in history.
 p.session.drafts[i]='';save();render();D('answerArea')?.focus();}
function eventBindings(){for(const el of document.querySelectorAll('[data-icon]'))el.innerHTML=icon(el.dataset.icon);
 D('menuToggle').onclick=()=>D('sidebar').classList.toggle('open');D('brandHome').onclick=()=>setMode('dashboard');D('newEssayTop').onclick=showCreate;D('newEssaySide').onclick=showCreate;D('navHome').onclick=()=>setMode('dashboard');D('settingsButton').onclick=()=>{settings();openModal('settingsModal');};D('exportButton').onclick=exportProgress;D('importButton').onclick=()=>D('importFile').click();
 D('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{importProgress(await f.text());}catch(error){toast(error.message);}e.target.value='';};
 D('essayInput').addEventListener('input',e=>D('inputWordCount').textContent=wordCount(e.target.value)+' words');D('essayForm').addEventListener('submit',createEssay);
 document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='answerArea'){const e=selected(),p=progress(e,stageId),i=p.session.current;p.session.drafts[i]=t.value;save();let b=D('checkTaskButton');if(b)b.disabled=!t.value.trim();}else if(t.classList.contains('cloze-input')){const e=selected(),p=progress(e,stageId);p.session.drafts[Number(t.dataset.gap)]=t.value;save();}});
 document.addEventListener('keydown',ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'&&mode==='stage'){ev.preventDefault();if(D('answerArea'))checkTask();else if(D('mainContent')?.querySelector('.cloze-fields'))checkCloze();}if(ev.key==='Escape'){closeModal('essayModal');closeModal('settingsModal');D('sidebar').classList.remove('open');}});
 document.addEventListener('click',async ev=>{const close=ev.target.closest('[data-close]');if(close){closeModal(close.dataset.close);return;}const btn=ev.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action,id=btn.dataset.id;
 switch(act){case'home':setMode('dashboard');break;case'addEssay':showCreate();break;case'selectEssay':db.selectedId=id;save();setMode('overview');break;case'overview':setMode('overview');break;case'stage':setMode('stage',id);break;case'prevTask':taskNav(progress(selected(),stageId).session.current-1);break;case'nextTask':taskNav(progress(selected(),stageId).session.current+1);break;case'task':mode='stage';taskNav(Number(id));break;case'checkTask':await checkTask();break;case'checkCloze':checkCloze();break;case'redo':redo();break;case'retryTask':retryTask();break;case'resultsSummary':summaryView();break;case'scrollGap':{const gap=D('gap-'+id);gap?.scrollIntoView({behavior:'smooth',block:'center'});gap?.querySelector('input')?.focus();break;}case'toggleSource':showSource=!showSource;render();break;case'export':exportProgress();break;case'import':D('importFile').click();break;case'enhanceAI':await enhance();break;case'explainAI':await explainAI(Number(id));break;case'deleteEssay':{const e=selected();if(!confirm(`Permanently delete "${e.title}" and all its attempts from this browser? Export a backup first if you need it.`))return;db.essays=db.essays.filter(x=>x.id!==e.id);db.selectedId=db.essays[0]?.id||null;save();setMode('dashboard');toast('Essay deleted.');break;}case'saveSettings':{const inp=D('accessInput');if(inp)db.accessCode=inp.value;save();closeModal('settingsModal');toast('Settings saved.');break;}}
 });
}
async function initialize(){db=load();if(!db.selectedId)db.selectedId=db.essays[0]?.id;eventBindings();render();try{const r=await fetch('/api/health');if(r.ok){const d=await r.json();ai.enabled=!!d.ai;ai.model=d.model;ai.accessCodeRequired=!!d.accessCodeRequired;render();}}catch{ /* Standalone HTML continues in offline mode. */ }
 if('serviceWorker'in navigator&&location.protocol!=='file:'&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
initialize();
